<!DOCTYPE html>  <!--The doctype statement indicates the markup language of the document-->
<html>
<head>
    <title>JS-Lab 2</title>
    <script type="text/javascript">

        document.write("<h1>JavaScript Programming is Easy</h1>");

        var fname;
        fname = window.prompt("Enter your first name");
        document.write("<h1>" + fname + " says: JavaScript Programming is Easy</h1>");

        var colour, size;
        colour = window.prompt("Enter the colour of the message");
        size = window.prompt("Enter the font size of the message");

        document.body.style.color = colour;
        document.body.style.fontSize = size + "px";

    </script>
</head>
<body>
</body>
</html>
